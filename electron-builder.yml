appId: com.timetracker.app
productName: TimeTracker
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - "!**/.vscode/*"
  - "!src/*"
  - "!scripts/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
asarUnpack:
  - resources/**
win:
  executableName: TimeTracker
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSHumanReadableCopyright: TimeTracker
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  icon: build/icon.png
  category: Utility
  synopsis: Time tracking, summary and invoicing
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
appImage:
  artifactName: ${name}-${version}.${ext}
deb:
  artifactName: ${name}-${version}.${ext}
  maintainer: TimeTracker <timetracker@example.com>
npmRebuild: true